<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot Demo — User Input</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; font-family: "Calibri", Arial, sans-serif; }
  canvas { border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 14px; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; }
</style>
</head>
<body>
<div class="hint">Left drag: draw &nbsp;|&nbsp; Scroll: colour &nbsp;|&nbsp; Keys 1/2/3: pencil / pen / marker &nbsp;|&nbsp; Right: erase</div>
<script>
let ctrl;

const BRUSH = {
  pencil: { size: 3,  alpha: 0.90, cap: ROUND  },
  pen:    { size: 7,  alpha: 0.75, cap: ROUND  },
  marker: { size: 16, alpha: 0.45, cap: SQUARE }
};

function setup() {
  createCanvas(800, 600);
  colorMode(HSB, 360, 100, 100);
  ctrl = new DrawController();
  textFont("Calibri");
}

function draw()        { ctrl.render(); }
function mousePressed() {
  if (mouseButton === LEFT)  ctrl.startStroke(mouseX, mouseY);
  if (mouseButton === RIGHT) ctrl.eraseClick(mouseX, mouseY);
}
function mouseDragged() {
  if (mouseButton === RIGHT) ctrl.eraseDrag(mouseX, mouseY);
  else ctrl.addPoint(mouseX, mouseY);
}
function mouseReleased() { ctrl.endStroke(); }
function mouseWheel(e)   { ctrl.cycleColour(e.delta); return false; }
function keyPressed()   { ctrl.switchTool(key); }

class DrawController {
  constructor() {
    this.strokes = [];
    this.current = null;
    this.tool = "pencil";
    this.hue = 180;
    this.lastErase = null;
  }

  startStroke(x, y) {
    this.current = { pts: [{ x, y }], tool: this.tool, hue: this.hue };
  }

  addPoint(x, y) {
    if (!this.current) return;
    const pts = this.current.pts;
    const last = pts[pts.length - 1];
    const n = Math.ceil(dist(last.x, last.y, x, y) / 2); // interpolate: keep strokes continuous
    for (let i = 1; i <= n; i++) {
      pts.push({ x: last.x + (x - last.x) * i / n, y: last.y + (y - last.y) * i / n });
    }
  }

  endStroke() {
    if (this.current) { this.strokes.push(this.current); this.current = null; }
  }

  switchTool(k) {
    const map = { 1: "pencil", 2: "pen", 3: "marker" };
    if (map[k]) this.tool = map[k];
  }

  cycleColour(delta) {
    this.hue = (this.hue + delta * 0.1 + 360) % 360;
  }

  eraseClick(x, y) {
    this.eraseRadius(x, y);
    this.lastErase = { x, y };
  }

  eraseDrag(x, y) {
    const sx = this.lastErase ? this.lastErase.x : x;
    const sy = this.lastErase ? this.lastErase.y : y;
    const n = Math.max(1, Math.ceil(dist(sx, sy, x, y) / 5)); // erase continuously
    for (let i = 1; i <= n; i++) {
      this.eraseRadius(sx + (x - sx) * i / n, sy + (y - sy) * i / n);
    }
    this.lastErase = { x, y };
  }

  eraseRadius(x, y) {
    for (const s of this.strokes) {
      s.pts = s.pts.filter(p => dist(x, y, p.x, p.y) > 40);
    }
    this.strokes = this.strokes.filter(s => s.pts.length > 0);
  }

  exportInputPoints() {
    const pts = [];
    for (const s of this.strokes) {
      for (const p of s.pts) {
        pts.push({ x: p.x, y: p.y, colour: s.hue, brushSize: BRUSH[s.tool].size, tool: s.tool });
      }
    }
    return pts;
  }

  render() {
    background(15, 5, 20);
    for (const s of this.strokes) this.drawStroke(s, 1);
    if (this.current) this.drawStroke(this.current, 0.6);
    this.drawHover();
    this.drawUI();
  }

  drawStroke(s, fade) {
    const b = BRUSH[s.tool];
    push();
    stroke(s.hue, 80, 90, fade * 100 * b.alpha);
    strokeWeight(b.size);
    strokeJoin(ROUND);
    strokeCap(b.cap);
    noFill();
    for (let i = 1; i < s.pts.length; i++) {
      const a = s.pts[i - 1], c = s.pts[i];
      if (dist(a.x, a.y, c.x, c.y) > 15) continue; // erased gap: don't reconnect
      line(a.x, a.y, c.x, c.y);
    }
    noStroke();
    fill(s.hue, 80, 90, fade * 100 * b.alpha);
    for (const p of s.pts) {
      if (b.cap === SQUARE) { rectMode(CENTER); rect(p.x, p.y, b.size, b.size); }
      else circle(p.x, p.y, b.size);
    }
    pop();
  }

  drawHover() {
    push();
    if (mouseIsPressed && mouseButton === RIGHT) {
      noFill(); stroke(0, 0, 100, 70); circle(mouseX, mouseY, 80); pop(); return; // erase range
    }
    const hx = constrain(mouseX + 20, 30, width - 30);
    const hy = constrain(mouseY - 20, 30, height - 30);
    fill(this.hue, 80, 90); noStroke(); circle(hx, hy, 18);
    stroke(0, 0, 100); strokeWeight(2); noFill(); circle(hx, hy, 18);
    pop();
  }

  drawUI() {
    push();
    fill(this.hue, 80, 90); noStroke(); circle(40, 40, 40);
    fill(0, 0, 100); noStroke(); textSize(16);
    text("Tool: " + this.tool, 70, 30);
    text("Hue: " + Math.round(this.hue), 70, 52);
    text("Points: " + this.exportInputPoints().length, 70, 74);
    pop();
  }
}
</script>
</body>
</html>
